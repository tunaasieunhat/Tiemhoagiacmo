# Cấu hình đưa game lên Netlify (xem docs/HUONG_DAN_DUA_LEN_MANG.md)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# trang chính, version.json, sw.js: luôn kiểm tra bản mới
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
# file có mã băm trong tên: lưu lâu
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
