# CHẠY 1 LẦN DUY NHẤT: tạo khóa ký ứng dụng Android.
# Tab Actions → "Tạo khóa ký APK" → Run workflow → tải Artifact "khoa-ky-apk" (tự xóa sau 1 ngày)
# → mở file HUONG_DAN.txt và làm theo (dán 4 giá trị vào Secrets). Sau đó XÓA file đã tải.
# ⚠️ Giữ khóa này cẩn thận: mất khóa thì người chơi phải gỡ app cũ mới cài được bản mới.
name: Tạo khóa ký APK

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Tạo khóa
        run: |
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24)
          mkdir out
          keytool -genkeypair -v -keystore out/release.jks -alias tiemhoa -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Tiem Hoa Giac Mo, OU=Game, O=Tiem Hoa, C=VN"
          base64 -w0 out/release.jks > out/ANDROID_KEYSTORE_BASE64.txt
          cat > out/HUONG_DAN.txt <<TXT
          Vào repo GitHub → Settings → Secrets and variables → Actions → tab "Secrets" → New repository secret.
          Tạo 4 secret sau (Name đúng y hệt, Value lấy như dưới):

          1) ANDROID_KEYSTORE_BASE64  = toàn bộ nội dung file ANDROID_KEYSTORE_BASE64.txt
          2) ANDROID_KEYSTORE_PASSWORD = $PASS
          3) ANDROID_KEY_ALIAS         = tiemhoa
          4) ANDROID_KEY_PASSWORD      = $PASS

          Cất thêm 1 bản sao file release.jks + mật khẩu ở nơi an toàn (USB, Google Drive riêng tư).
          Sau đó xóa thư mục vừa tải về khỏi máy tính.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: khoa-ky-apk
          path: out/
          retention-days: 1
