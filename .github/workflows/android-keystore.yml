# CHẠY 1 LẦN DUY NHẤT: tạo khóa ký ứng dụng Android.
# Tab Actions → "Tạo khóa ký APK" → Run workflow → tải Artifact "khoa-ky-apk" (tự xóa sau 1 ngày)
# → mở file HUONG_DAN.txt và làm theo (tạo 1 secret ANDROID_KEYSTORE_B64). Sau đó cất bản sao rồi XÓA file đã tải.
# ⚠️ Giữ khóa này cẩn thận: mất khóa thì người chơi phải gỡ app cũ mới cài được bản mới.
name: Tạo khóa ký APK

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Không tạo lại nếu đã có khóa
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "::error title=Đã có khóa ký::Repo đã có secret ANDROID_KEYSTORE_B64. Tạo khóa mới sẽ làm người chơi phải gỡ app cũ. Nếu thật sự muốn đổi khóa, xóa secret đó trước rồi chạy lại."
            exit 1
          fi
      - name: Tạo khóa
        run: |
          # Mật khẩu cố định, phải khớp với KS_PASS / KS_ALIAS trong android.yml
          PASS=tiemhoagiacmo
          mkdir out
          keytool -genkeypair -keystore out/release.p12 -storetype PKCS12 -alias tiemhoa -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Tiem Hoa Giac Mo, OU=Game, O=Tiem Hoa, C=VN"
          base64 -w0 out/release.p12 > out/ANDROID_KEYSTORE_B64.txt
          LEN=$(wc -c < out/ANDROID_KEYSTORE_B64.txt)
          cat > out/HUONG_DAN.txt <<TXT
          Vào repo GitHub → Settings → Secrets and variables → Actions → tab "Secrets" → New repository secret.

            Name  : ANDROID_KEYSTORE_B64
            Secret: toàn bộ nội dung file ANDROID_KEYSTORE_B64.txt (dài $LEN ký tự)

          Bấm "Add secret" là xong. Lần build APK sau sẽ tự ký và đăng lên trang Releases.

          Cất thêm 1 bản sao file release.p12 (hoặc ANDROID_KEYSTORE_B64.txt) ở nơi an toàn
          (USB, Google Drive riêng tư), rồi xóa thư mục vừa tải về khỏi máy.
          TXT
          echo "::notice title=Đã tạo khóa::Tải Artifact khoa-ky-apk bên dưới, mở HUONG_DAN.txt và làm theo."
      - uses: actions/upload-artifact@v4
        with:
          name: khoa-ky-apk
          path: out/
          retention-days: 1
