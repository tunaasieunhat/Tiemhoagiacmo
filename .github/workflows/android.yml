# Đóng gói ứng dụng Android (APK) tự động.
# Chạy khi: bấm "Run workflow" trong tab Actions, khi đẩy code (thay đổi game), hoặc khi tạo tag dạng v0.9.0.
# Kết quả: tab Actions → lượt chạy → mục "Artifacts" → tải TiemHoaGiacMo-apk. Với tag v*: APK được gắn vào trang Releases.
name: Đóng gói APK Android

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - 'src/**'
      - 'data/**'
      - 'public/**'
      - 'assets/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/android-setup.mjs'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Điền trong Settings → Secrets and variables → Actions → tab "Variables" (không phải bí mật)
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ vars.SITE_URL }}
      VITE_APK_URL: ${{ vars.APK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm ci

      - name: Build game
        run: npm run build

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx --yes @capacitor/assets@4.0.0 generate --android --iconBackgroundColor '#ffe3ea' --iconBackgroundColorDark '#ffe3ea' --splashBackgroundColor '#ffe3ea' --splashBackgroundColorDark '#ffe3ea'
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Giải mã khóa ký (nếu đã cài)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa cài khóa ký: tạo APK bản thử (debug). Xem docs/HUONG_DAN_APK.md để tạo khóa."
          fi

      - name: Build APK (đã ký)
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TiemHoaGiacMo.apk"

      - name: Build APK (bản thử, chưa ký chính thức)
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/TiemHoaGiacMo.apk"

      - name: Đặt tên file theo phiên bản
        run: |
          V=$(node -p "require('./package.json').version")
          mv TiemHoaGiacMo.apk "TiemHoaGiacMo-$V.apk"
          ls -la *.apk

      - name: Tải lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TiemHoaGiacMo-apk
          path: TiemHoaGiacMo-*.apk
          retention-days: 30

      - name: Đăng lên trang Releases (khi tạo tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TiemHoaGiacMo-*.apk
          generate_release_notes: true
