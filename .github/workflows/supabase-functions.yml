# Tự đưa Edge Function "contest-submit" lên Supabase mỗi khi file build thay đổi
# (thay cho việc dán code bằng tay trong Supabase Dashboard).
# Cần 1 secret trong GitHub: SUPABASE_ACCESS_TOKEN (tạo ở https://supabase.com/dashboard/account/tokens).
# Chưa có secret thì lượt chạy chỉ báo "bỏ qua", không lỗi.
name: Đưa Edge Function lên Supabase

on:
  workflow_dispatch:
  push:
    branches: [main, ccr-845954e0-2hh7a1]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nhwqubttbkpcuckrduij
    steps:
      - name: Kiểm tra mã truy cập Supabase
        id: chk
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Chưa có secret SUPABASE_ACCESS_TOKEN — bỏ qua. Xem docs/HUONG_DAN_SUPABASE.md (Bước 2c)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: supabase/setup-cli@v1
        if: steps.chk.outputs.skip != '1'
        with:
          version: latest
      - name: Đưa contest-submit lên (tắt Verify JWT như hướng dẫn)
        if: steps.chk.outputs.skip != '1'
        run: supabase functions deploy contest-submit --project-ref "$PROJECT_REF" --no-verify-jwt --use-api --yes # --yes: bản CLI mới đòi xác nhận, máy tự động không hỏi được
